name: Unit Tests Allure 3 TestOps Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - unit/**
      - .github/workflows/unit-tests-allure3-testops.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unit
    env:
      CI: true
      TESTOPS_URL: ${{ secrets.TESTOPS_URL }}
      TESTOPS_TOKEN: ${{ secrets.TESTOPS_TOKEN }}
      TESTOPS_PROJECT_ID: ${{ secrets.TESTOPS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: python -m pip install -r requirements.txt

      - run: npm install --no-save allure @allurereport/plugin-testops

      - run: npx allure run --config ./allurerc.testops.mjs -- python -m pytest --alluredir allure-results
