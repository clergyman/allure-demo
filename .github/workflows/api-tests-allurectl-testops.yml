name: API Tests allurectl TestOps Upload

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "Service parameter. Leave blank."
        required: false
      ALLURE_USERNAME:
        description: "Service parameter. Leave blank."
        required: false
  push:
    branches:
      - main
    paths:
      - API/**
      - .github/workflows/api-tests-allurectl-testops.yml

jobs:
  test:
    runs-on: ubuntu-latest
    environment: Jira + GH Cafe
    defaults:
      run:
        working-directory: API
    env:
      ALLURE_RESULTS: allure-results
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_USERNAME: ${{ github.event.inputs.ALLURE_USERNAME }}
      DEMO_DISABLE_FLAKES: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ secrets.TESTOPS_URL }}
          allure-token: ${{ secrets.TESTOPS_TOKEN }}
          allure-project-id: ${{ secrets.TESTOPS_PROJECT_ID }}

      - run: python -m pip install -r requirements.txt

      - run: allurectl watch -- python -m pytest --alluredir allure-results
